{% load static %}<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}IABAS{% endblock %}</title>
<style>
:root{--ink:#1c2b30;--mute:#5d6d72;--line:#dde3e2;--bg:#f4f6f5;--card:#fff;--teal:#0e6b6b;--teal-d:#0a5252;--amber:#e8a33d;--red:#b3402f;--green:#2e7d4f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--ink);color:#fff;padding:.7rem 1.5rem;display:flex;align-items:center;gap:1.2rem}
header strong{font-size:1.15rem;letter-spacing:.02em}header strong span{color:var(--amber)}
header nav{margin-left:auto;display:flex;gap:1rem;align-items:center;font-size:.95rem}
header a,header button{color:#fff;background:none;border:0;font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
main{max-width:1000px;margin:1.5rem auto;padding:0 1rem}
h1{font-size:1.5rem;margin:.2rem 0 1rem}h2{font-size:1.15rem;margin:1.5rem 0 .6rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1.2rem 1.4rem;margin-bottom:1rem}
table{width:100%;border-collapse:collapse;font-size:.95rem}th,td{text-align:left;padding:.6rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mute);font-weight:600}
.btn{display:inline-block;background:var(--teal);color:#fff;border:0;border-radius:4px;padding:.5rem 1rem;font:inherit;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--teal-d)}.btn.sec{background:#fff;color:var(--teal);border:1px solid var(--teal)}.btn.red{background:var(--red)}
.tag{display:inline-block;padding:.05rem .55rem;border-radius:99px;font-size:.8rem;border:1px solid var(--line);color:var(--mute)}
.tag.ok{color:var(--green);border-color:var(--green)}.tag.warn{color:var(--red);border-color:var(--red)}.tag.pend{color:#9a6a12;border-color:var(--amber)}
.msg{padding:.7rem 1rem;border-radius:4px;margin-bottom:.8rem;border-left:4px solid}
.msg.success{background:#e6f3ec;border-color:var(--green)}.msg.error{background:#f8e7e3;border-color:var(--red)}.msg.warning{background:#fbf1de;border-color:var(--amber)}
.mute{color:var(--mute)}.small{font-size:.88rem}input[type=text],input[type=password]{width:100%;padding:.55rem;border:1px solid #b9c4c2;border-radius:4px;font:inherit}
details summary{cursor:pointer;color:var(--teal)}
@media(max-width:700px){table{font-size:.85rem}}
</style></head><body>
<header><strong>IABAS<span>.</span></strong>
<nav>{% if user.is_authenticated %}<span class="mute">{{ user.get_full_name|default:user.username }}</span>
<form method="post" action="{% url 'logout' %}" style="margin:0">{% csrf_token %}<button>Cerrar sesión</button></form>{% endif %}</nav></header>
<main>{% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
{% block content %}{% endblock %}</main></body></html>
