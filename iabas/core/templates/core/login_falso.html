<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal corporativo</title>
<style>body{margin:0;background:#e9eef5;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}
.box{background:#fff;padding:2rem;width:min(380px,92vw);border-radius:6px;box-shadow:0 2px 10px #0002}
input{width:100%;padding:.6rem;margin:.3rem 0 1rem;border:1px solid #aab;border-radius:4px;font:inherit}
button{width:100%;background:#2b6cb0;color:#fff;border:0;padding:.7rem;border-radius:4px;font:inherit;cursor:pointer}</style></head>
<body><form class="box" method="post">{% csrf_token %}<h2 style="margin-top:0">Portal corporativo</h2>
<p style="color:#555">Inicia sesión para continuar.</p>
<label>Correo<input type="text" name="usuario" autocomplete="off"></label>
<label>Contraseña<input type="password" name="clave" autocomplete="off"></label>
<button>Iniciar sesión</button></form></body></html>
